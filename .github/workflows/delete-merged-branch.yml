name: Supprimer la branche mergée

# Déclenché depuis la branche de BASE de la PR (pull_request_target), pas depuis
# la branche head : le workflow s'exécute donc même sur les branches créées avant
# son installation. Aucun code de la PR n'est récupéré ici, uniquement un appel API.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  supprimer:
    # On ne touche ni aux branches au long cours, ni aux PR venant d'un fork.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["dev","main","master","preprod","production"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer la branche head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Branche $BRANCH supprimée."
          else
            echo "Branche $BRANCH non supprimée (déjà absente ou protégée)."
          fi
